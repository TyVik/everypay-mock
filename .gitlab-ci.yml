workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG
  auto_cancel:
    on_new_commit: interruptible

stages:
  - build

build:
  stage: build
  image: docker:28
  services:
    - docker:28-dind
  interruptible: true
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKERHUB_USERNAME: tyvik
    IMAGE: docker.io/tyvik/everypay-mock
    CACHE_REF: $IMAGE:buildcache
  before_script:
    - docker buildx create --use --driver docker-container
    - echo "$DOCKERHUB_TOKEN" | docker login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        TAGS="--tag $IMAGE:$CI_COMMIT_TAG"
      else
        TAGS="--tag $IMAGE:$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
      fi
    - |
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        OUTPUT="--output type=image,push=false"
        CACHE_TO=""
      else
        OUTPUT="--push"
        CACHE_TO="--cache-to type=registry,ref=$CACHE_REF,mode=max"
      fi
    - >
      docker buildx build .
      $TAGS $OUTPUT
      --cache-from type=registry,ref=$CACHE_REF
      $CACHE_TO
      --label org.opencontainers.image.title=$CI_PROJECT_NAME
      --label org.opencontainers.image.source=$CI_PROJECT_URL
      --label org.opencontainers.image.url=$CI_PROJECT_URL
      --label org.opencontainers.image.revision=$CI_COMMIT_SHA
      --label org.opencontainers.image.created=$CI_JOB_STARTED_AT
