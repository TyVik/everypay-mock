apiVersion: v1
kind: Service
metadata:
  name: {{ include "everypay.fullname" . }}
  labels:
    {{- include "everypay.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "everypay.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http    # именованный порт nginx-контейнера (80), nginx проксирует в app
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
