apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "everypay.fullname" . }}-nginx
  labels:
    {{- include "everypay.labels" . | nindent 4 }}
data:
  default.conf: |
    upstream app {
        server 127.0.0.1:{{ .Values.web.port }};   # app-контейнер в том же поде
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size {{ .Values.nginx.clientMaxBodySize }};

        gzip on;
        gzip_types text/css application/javascript application/json image/svg+xml;

        # статика, собранная init-контейнером (collectstatic -> emptyDir)
        location /static/ {
            alias /var/www/static/;
            expires 7d;
            access_log off;
        }

        location / {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }
