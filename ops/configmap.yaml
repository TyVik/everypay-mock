apiVersion: v1
kind: ConfigMap
metadata:
  name: everypay-config
  labels:
    app: everypay
data:
  POSTGRES_HOST: "postgres-hs.infra-postgres.svc.cluster.local"
  POSTGRES_PORT: "5432"
  POSTGRES_USER: "everypay"
  POSTGRES_DB_NAME: "everypay"
  DB_ECHO: "false"
  DEBUG: "True"
  ALLOWED_HOSTS: "*"
  ACCESS_TOKEN_EXPIRE_SECONDS: "60"
  REFRESH_TOKEN_EXPIRE_SECONDS: "86400"
  DJANGO_SETTINGS_MODULE: "config.settings"
  CORS_ALLOWED_ORIGINS: ""
  CORS_ALLOW_ALL_ORIGINS: "True"
  CSRF_TRUSTED_ORIGINS: "http://192.168.10.201:30800"
